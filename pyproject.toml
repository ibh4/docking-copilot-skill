[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docking-copilot-skill"
version = "0.1.0"
description = "A reproducible molecular docking Copilot Skill: configuration, script generation, parameter validation and result interpretation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "DockingCopilot Skill Contributors" }]
keywords = [
    "molecular docking",
    "virtual screening",
    "AutoDock Vina",
    "RDKit",
    "cheminformatics",
]
# 计算化学核心依赖（rdkit / vina / meeko / openbabel）优先由 conda-forge
# 提供，见 environment.yml；此处仅列纯 Python 依赖以便 pip fallback。
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "networkx>=3.2",
    "biopython>=1.83",
    "scikit-learn>=1.3",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[tool.setuptools]
packages = [
    "backend.app",
    "backend.app.api",
    "backend.app.services",
    "backend.app.workflow",
    "backend.app.utils",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
    "slow: 真实 Vina 对接相关测试（需要数秒~数十秒）",
]
